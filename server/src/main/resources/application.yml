spring:
  application:
    name: moa-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  address: ${MOA_SERVER_ADDRESS:127.0.0.1}
  port: ${MOA_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
